    if (it.type) b.insertAdjacentHTML("beforeend", `<span class="play">&#9654;</span>` + (it.title ? `<span class="t">${esc(it.title)}</span>` : ""));
    b.onclick = () => open(n);
    grid.append(b);
  });
  $("#empty").hidden = list.length > 0; scrollTo(0,0); reveal([...grid.children]);
}
function open(n){
  idx = (n + list.length) % list.length;
  const it = list[idx];
  stage.innerHTML = it.type==="ig" ? `<iframe class="ig" src="https://www.instagram.com/${esc(it.src)}/embed/" allowfullscreen title="${esc(it.title)}"></iframe>` : it.type==="yt" ? `<iframe${it.v ? ' class="v"' : ""} src="https://www.youtube-nocookie.com/embed/${esc(it.src)}?autoplay=1&rel=0" allow="autoplay;fullscreen" allowfullscreen title="${esc(it.title)}"></iframe>`
    : it.type==="video" ? `<video src="${esc(it.src)}" poster="${esc(it.poster)}" controls autoplay playsinline></video>`
    : `<img src="${esc(it.src)}" alt="">`;
  $("#cap").textContent = it.title || "";
  if (!lb.open) { lb.showModal(); document.documentElement.classList.add("lock"); }
}
lb.querySelector(".x").onclick = () => lb.close();
lb.querySelector(".p").onclick = () => open(idx-1);
lb.querySelector(".n").onclick = () => open(idx+1);
lb.addEventListener("close", () => { stage.innerHTML = ""; document.documentElement.classList.remove("lock"); });
lb.addEventListener("click", e => { if (e.target===lb || e.target.classList.contains("stage")) lb.close(); });
document.addEventListener("keydown", e => { if (lb.open) { if (e.key==="ArrowLeft") open(idx-1); if (e.key==="ArrowRight") open(idx+1); } });
const hlEl = document.querySelector("#home .hl"), hqEl = document.querySelector("#home .q"); addEventListener("scroll", () => { if (document.body.dataset.v === "home") { const t = Math.min(1, scrollY / (innerHeight * .5)); hlEl.style.opacity = (.92 * (1 - t)).toFixed(2); hqEl.style.opacity = (.85 * (1 - t)).toFixed(2); document.body.style.setProperty("--hq", t.toFixed(2)); } }, {passive:true});

addEventListener("hashchange", route); route();
</script>
